; Mobile preset (GameNative / Winlator). Copy into the game's Mods folder and
; rename it to SteamShadows.ini. Same shadow sharpness as the desktop file:
; the far map keeps ~21 texels per block (2048 over 2 x 48 blocks) and the
; near map is unchanged. Shadows reach 48 blocks instead of 70; the fade still
; starts about 28 blocks out (58% of 48, as 40% of 70 did). The far map is
; redrawn every other frame (StaggerFarMap=1).
[Shadows]
Resolution=2048
Radius=48
StrengthPercent=100
CloudShadows=1
SoftShadows=0

SunWarmthPercent=3

FadeStartPercent=58
CameraFade=1
SunFromGame=1

Cascades=1
NearResolution=2048
NearRadius=32
BatchCasters=1
TightTerrainBounds=1
TightModelBounds=1
StaggerFarMap=1
